- id: piani-2026
  data: 2026-03-04
  titolo: Il 2026 di Assassin's Creed secondo Ubisoft
  testo: "Ubisoft conferma Hexe, un capitolo narrativo «più cupo», e Invictus, un gioco multigiocatore sviluppato da veterani di For Honor. Jade resta in lavorazione e il team studia come riportare la modalità cooperativa nella serie."
